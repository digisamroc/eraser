# Install: pre-commit install
# Run on everything: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: \.min\.(js|css)$|^internal/web/static/css/app\.css$  # generated; must match build output byte-for-byte
      - id: trailing-whitespace
        exclude: \.min\.(js|css)$|^internal/web/static/css/app\.css$  # generated; must match build output byte-for-byte
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.15.0
    hooks:
      # Lints the whole repository (it has no lint debt). Avoids the
      # changed-lines mode, which silently reports nothing in a symlinked
      # checkout (e.g. ~/src -> ~/Dropbox/src).
      - id: golangci-lint-full
        entry: golangci-lint run
      - id: golangci-lint-config-verify

  - repo: local
    hooks:
      - id: no-personal-data
        name: block personal config, history, and job files
        description: These files hold names, addresses, credentials, or send history.
        language: fail
        entry: personal data files must never be committed
        files: (^|/)(config\.yaml|config\.local\.yaml|pending_job\.json|[^/]*\.db)$
        exclude: ^config\.example\.yaml$

      - id: gofmt
        name: gofmt
        language: system
        entry: bash -c 'out=$(gofmt -l "$@"); if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi' --
        types: [go]

      - id: go-mod-tidy
        name: go mod tidy
        language: system
        entry: go mod tidy -diff
        files: (^go\.(mod|sum)$|\.go$)
        pass_filenames: false

      - id: go-vet
        name: go vet
        language: system
        entry: go vet ./...
        types: [go]
        pass_filenames: false

      - id: go-test
        name: go test
        language: system
        # -short skips the real-browser tests; CI runs everything.
        entry: go test -short ./...
        types: [go]
        pass_filenames: false

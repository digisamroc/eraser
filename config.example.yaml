# Eraser Configuration Example
# Copy this file to ~/.eraser/config.yaml and fill in your details

profile:
  # Required: Your personal information for removal requests
  first_name: John
  last_name: Doe
  email: john.doe@example.com

  # Optional. These are stored locally and are NOT sent to brokers unless
  # listed in options.disclose below (or a broker's own disclose list).
  address: "123 Main Street"
  city: "San Francisco"
  state: "CA"
  zip_code: "94102"
  country: "USA"
  phone: "+1-555-123-4567"
  date_of_birth: "1990-01-15"  # Format: YYYY-MM-DD

email:
  # Email provider: only "smtp" is supported
  provider: smtp
  from: john.doe@example.com

  # SMTP configuration (for Gmail, Outlook, etc.)
  smtp:
    host: smtp.gmail.com
    port: 465            # 465 = implicit TLS; 587 = STARTTLS
    username: john.doe@gmail.com
    password: your-app-password  # Use app password, not your regular password!
    use_tls: true        # required when username is set; never falls back to plaintext
    # tls_mode: starttls # only needed to override the port-based default

options:
  # Template to use: "gdpr", "ccpa", or "generic"
  template: generic

  # Profile fields to include in removal emails. Name and email are always
  # sent; nothing else is unless listed here. Two data points are generally
  # enough for a broker to verify a deletion request, so start with none and
  # add only if brokers ask. Brokers that need more can also be configured
  # individually in data/brokers.manual.yaml.
  #   location        city, state, ZIP/postal code, country
  #   street_address  street address (also sends location)
  #   phone
  #   date_of_birth
  # disclose:
  #   - location

  # Delay between emails in milliseconds (avoid spam filters)
  rate_limit_ms: 2000

  # Max successful sends per rolling 24 hours, counting earlier runs and the
  # web UI (default 250; Gmail allows ~500/day)
  # daily_limit: 250

  # Skip brokers you successfully sent to within this many days (default 30).
  # Brokers have up to 45 days to respond under CCPA. `send --force-resend`
  # ignores this.
  # resend_after_days: 30

  # Only send to brokers in these regions (optional)
  # regions:
  #   - us
  #   - global

  # Skip these brokers (optional)
  # excluded_brokers:
  #   - spokeo
  #   - whitepages

# Browser automation for `eraser fill` (optional)
# pipeline:
#   browser_headless: true   # false shows the browser window
#   browser_timeout_sec: 30

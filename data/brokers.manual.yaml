# Hand-maintained overlay applied on top of the California CPPA data broker
# registry when generating data/brokers.yaml. Regenerate after editing:
#
#   go run ./cmd/registry-import
#
# Every entry must cite an https source_url so it can be re-checked later.
# Personal mailboxes (Gmail, Outlook, etc.) are always rejected.
#
#   add:       brokers that are not in the registry
#   overrides: changes to a registry entry, matched by email
#              (category, opt_out_url, notes, tags: [form-only],
#               disclose: extra profile fields this broker needs, e.g.
#               [date_of_birth]; cite the broker's request or privacy page)
#   exclude:   registry entries to drop, matched by email (reason required)

add:
  # Registry rows with a mistyped or dead email address (excluded below),
  # re-added with the privacy address the broker's own site gives.
  - id: kontext-data
    name: Kontext Data
    email: privacy@kontextdata.com
    website: https://kontextdata.com
    opt_out_url: https://kontextdata.com/opt_out
    region: us
    category: data-broker
    notes: The opt-out page asks for requests by email to this address.
    source_url: https://kontextdata.com/opt_out
    registry_id: "1605"
  - id: adttribution
    name: Adttribution Inc
    email: privacy@adttribution.com
    website: https://www.adttribution.com
    opt_out_url: https://www.adttribution.com/opt-out/
    region: us
    category: data-broker
    source_url: https://www.adttribution.com/opt-out/
    registry_id: "1239"
  - id: 5x5-us
    name: 5x5 US, LLC
    email: privacy@5x5coop.com
    website: https://5x5data.com
    opt_out_url: https://privacy.5x5data.com/5x5/opt-out
    region: us
    category: data-broker
    source_url: https://5x5data.com/privacy-policy-consumer/
    registry_id: "1475"

overrides:
  # Reported in upstream PR #29 (one user's real sends, not independently
  # verified): these registered addresses do not process emailed requests.
  # Each is marked form-only so `send` skips it and points to the form.
  - email: dataprivacy@liftbasedata.com
    tags: [form-only]
    opt_out_url: https://www.liftbasedata.com/your-privacy-choices
    notes: Email is not processed; use the privacy-choices form.
    source_url: https://github.com/digisamroc/eraser/pull/29
  - email: privacy@epsilon.com
    tags: [form-only]
    opt_out_url: https://legal.epsilon.com/dsr/
    notes: Email is not processed; use the DSR form. Lotame merged into Epsilon.
    source_url: https://github.com/digisamroc/eraser/pull/29
  - email: privacy@transunion.com
    tags: [form-only]
    opt_out_url: https://www.transunion.com/consumer-privacy
    notes: Email is not processed; use the consumer-privacy page.
    source_url: https://github.com/digisamroc/eraser/pull/29
  - email: privacy.department@nielsen.com
    tags: [form-only]
    opt_out_url: https://priv-policy.imrworldwide.com/priv/optout/digital-optout.html
    notes: Email is not processed; use Nielsen's digital opt-out.
    source_url: https://github.com/digisamroc/eraser/pull/29
  - email: privacy@33across.com
    tags: [form-only]
    opt_out_url: https://www.33across.com/opt-out
    notes: Email is not processed; use the opt-out page.
    source_url: https://github.com/digisamroc/eraser/pull/29
  - email: privacy@affinitysolutions.com
    tags: [form-only]
    opt_out_url: https://affinitysolutions-privacy.my.onetrust.com/webform/a564cfa1-53bf-4c10-bf95-cd907432d7e8/7e4e6bf3-6562-454e-8c73-6a7bd1f4b336
    notes: Email is not processed; use the OneTrust form.
    source_url: https://github.com/digisamroc/eraser/pull/29
  - email: privacy.officer@belardiwong.com
    tags: [form-only]
    opt_out_url: https://privacyportal.onetrust.com/webform/3d2d5e0c-bd98-46b8-906c-ede68a6f6a80/400f54ed-fcbb-4749-ab5b-32f491c72390
    notes: Inbox is not monitored; use the OneTrust deletion form.
    source_url: https://github.com/digisamroc/eraser/pull/29
  - email: requests@apollointeractive.com
    tags: [form-only]
    opt_out_url: https://www.apollointeractive.com/data-rights.php
    notes: Email is not processed; use the data-rights page.
    source_url: https://github.com/digisamroc/eraser/pull/29
  - email: dataprotectionofficer@iss-stoxx.com
    tags: [form-only]
    opt_out_url: https://www.issgovernance.com/privacy-legal/ccpa/
    notes: Email is not processed; use the CCPA page.
    source_url: https://github.com/digisamroc/eraser/pull/29
  - email: legal@hightouch.com
    tags: [form-only]
    opt_out_url: https://preferences.hightouch.com/
    notes: Email is not processed; use the preferences page.
    source_url: https://github.com/digisamroc/eraser/pull/29
  - email: privacy@crexi.com
    tags: [form-only]
    opt_out_url: https://crexi.bigidprivacy.cloud/consumer/#/o2TCsG9LJ7
    notes: Email is not processed; use the BigID privacy form.
    source_url: https://github.com/digisamroc/eraser/pull/29
  - email: privacy@datadecisionsgroup.com
    tags: [form-only]
    opt_out_url: https://datadecisionsgroup.com/preferences
    notes: Email is not processed; use the preferences page.
    source_url: https://github.com/digisamroc/eraser/pull/29
  - email: usprivacyquestions@deloitte.com
    tags: [form-only]
    opt_out_url: https://datasubject.deloitte.com/request-form
    notes: Email is not processed; use the data-subject request form.
    source_url: https://github.com/digisamroc/eraser/pull/29
  - email: privacy@demandbase.com
    tags: [form-only]
    notes: Email is not processed; use their privacy page (registry link). They may require a business email.
    source_url: https://github.com/digisamroc/eraser/pull/29
  - email: privacy@dstillery.com
    tags: [form-only]
    opt_out_url: https://dstillery.com/do-not-sell-my-personal-information/
    notes: Email is not processed; use the do-not-sell page.
    source_url: https://github.com/digisamroc/eraser/pull/29

  # Registry opt-out URLs on mistyped hosts (dropped by -check-mx), replaced
  # with the page the broker's own privacy policy links to.
  - email: privacy@predactiv.com
    opt_out_url: https://sharethis.com/data-subject-privacy-request/
    source_url: https://predactiv.com/privacy-policy/
  - email: support@peoplesearcher.com
    opt_out_url: https://www.peoplesearcher.com/api/helper/optOutLight/search?type=removal
    notes: Use "Remove My Information"; "Your Privacy Choices" does not remove a listing.
    source_url: https://www.peoplesearcher.com/privacy
  - email: privacy@mobilityglobal.com
    opt_out_url: https://www.mobilityglobal.com/en-us/your-privacy-choices
    source_url: https://www.mobilityglobal.com/en-us/privacy

exclude:
  - email: info@kontextdata.com
    reason: Its opt-out page asks for requests at privacy@kontextdata.com (re-added above).
    source_url: https://kontextdata.com/opt_out
  - email: hello@adttrbution.com
    reason: Mistyped domain (adttrbution.com) with no mail host; re-added above with the site's privacy address.
    source_url: https://www.adttribution.com/opt-out/
  - email: contact@join5x5.com
    reason: join5x5.com has no mail host; re-added above with the privacy address from 5x5's consumer notice.
    source_url: https://5x5data.com/privacy-policy-consumer/

# Hand-maintained overlay applied on top of the California CPPA data broker
# registry when generating data/brokers.yaml. Regenerate after editing:
#
#   go run ./cmd/registry-import
#
# Every entry must cite an https source_url so it can be re-checked later.
# Personal mailboxes (Gmail, Outlook, etc.) are always rejected.
#
#   add:       brokers that are not in the registry
#   overrides: changes to a registry entry, matched by email
#              (category, opt_out_url, notes, tags: [form-only])
#   exclude:   registry entries to drop, matched by email (reason required)

add: []

overrides:
  # Reported in upstream PR #29 (one user's real sends, not independently
  # verified): these registered addresses do not process emailed requests.
  # Each is marked form-only so `send` skips it and points to the form.
  - email: dataprivacy@liftbasedata.com
    tags: [form-only]
    opt_out_url: https://www.liftbasedata.com/your-privacy-choices
    notes: Email is not processed; use the privacy-choices form.
    source_url: https://github.com/digisamroc/eraser/pull/29
  - email: privacy@epsilon.com
    tags: [form-only]
    opt_out_url: https://legal.epsilon.com/dsr/
    notes: Email is not processed; use the DSR form. Lotame merged into Epsilon.
    source_url: https://github.com/digisamroc/eraser/pull/29
  - email: privacy@transunion.com
    tags: [form-only]
    opt_out_url: https://www.transunion.com/consumer-privacy
    notes: Email is not processed; use the consumer-privacy page.
    source_url: https://github.com/digisamroc/eraser/pull/29
  - email: privacy.department@nielsen.com
    tags: [form-only]
    opt_out_url: https://priv-policy.imrworldwide.com/priv/optout/digital-optout.html
    notes: Email is not processed; use Nielsen's digital opt-out.
    source_url: https://github.com/digisamroc/eraser/pull/29
  - email: privacy@33across.com
    tags: [form-only]
    opt_out_url: https://www.33across.com/opt-out
